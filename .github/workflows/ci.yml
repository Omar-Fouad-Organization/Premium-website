name: React and Laravel checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_DATABASE: green_life_expo_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-only-password"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npm run build
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, mbstring, fileinfo
          coverage: none
      - run: composer install --no-interaction --prefer-dist
        working-directory: backend
      - run: |
          cp .env.testing.example .env.testing
          php artisan key:generate --env=testing
          php artisan test --compact
        working-directory: backend
        env:
          DB_USERNAME: root
          DB_PASSWORD: ci-only-password
